[tools]
python = "3.12"
uv = "0.11"

[tasks.bootstrap]
run = "uv sync --frozen"

[tasks.format]
run = "uv run ruff format ."

[tasks.lint]
run = "uv run ruff check ."

[tasks.test]
run = "uv run pytest"

[tasks.check]
run = """
uv run ruff format --check .
uv run ruff check .
uv run pytest
git diff --check
"""
