name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v6

      - name: Подготовить окружение
        uses: jdx/mise-action@v2

      - name: Установить зависимости
        run: mise run bootstrap

      - name: Запустить проверки
        run: mise run check
